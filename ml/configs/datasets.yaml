  - dataset_id: sensefi_widar
    official_name: SenseFi processed Widar
    official_url: https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark
    download_url: https://drive.google.com/drive/folders/1R0R8SlVbLI1iUFQCzh_mH90H_4CW2iwt
    citation: "Yang, Jianfei et al. SenseFi: A Library and Benchmark on Deep-Learning-Empowered WiFi Human Sensing. Patterns 4(3), 2023; Widar3.0 project."
