    frequency_band: verification_required
    channel_bandwidth: verification_required
    number_of_subcarriers: "Processed BVP size 22 x 20 x 20, not raw subcarriers"
    antenna_configuration: "Processed BVP"
    sampling_rate: verification_required
    available_labels: [22_gesture_classes]
    intended_aeris_use: "Gesture/motion auxiliary pretraining, not direct intrusion labels"
    loader_implementation_status: partial
    notes: "CSV BVP samples can be loaded, but they are not raw CSI."

