datasets:
  - dataset_id: aeris
    official_name: AERIS Recorder native Nexmon CSI sessions
    official_url: https://github.com/pulkitpareek18/AERIS
    download_url:
    citation: "AERIS project repository; cite the project plus Nexmon CSI when publishing."
    license: verification_required
    source_format: "AERIS session directory: capture.pcap, metadata.json, labels.csv, quality.json, optional aeris.db metadata"
    csi_hardware_chipset: "Broadcom BCM43455 via Nexmon CSI on Raspberry Pi 4"
    frequency_band: "2.4 GHz or 5 GHz depending on configured hotspot"
    channel_bandwidth: "20/40/80 MHz as reported by recorder metadata"
    number_of_subcarriers: "64/128/256 raw Nexmon carriers including guard/null carriers"
    antenna_configuration: "Typically one configured core/spatial stream in current recorder config"
    sampling_rate: "Controlled by probe traffic; default ping_interval_s=0.025 (~40 Hz target)"
    available_labels: [warmup, empty_calibration, empty, transition_enter, movement, transition_exit, enter, exit, across_left_to_right, across_right_to_left, toward_pi, away_from_pi]
    intended_aeris_use: "Fine-tuning, site calibration, validation, and later Raspberry Pi deployment evaluation"
    loader_implementation_status: implemented
    notes: "Participant names remain local DB/UI metadata and are not part of canonical prediction targets."

  - dataset_id: presence_movement
    official_name: "A Wi-Fi Channel State Information (CSI) and Received Signal Strength (RSS) data-set for human presence and movement detection"
    official_url: https://zenodo.org/records/3677366
    download_url: https://zenodo.org/records/3677366
    citation: "Scheurer, Sebastian. A Wi-Fi Channel State Information (CSI) and Received Signal Strength (RSS) data-set for human presence and movement detection. Zenodo. https://doi.org/10.5281/zenodo.3677366"
    license: CC-BY-4.0
    source_format: "gzip-compressed line-delimited CSI JSON (*.csi.json.gz) plus annotations.csv"
    csi_hardware_chipset: "Intel CSI Tool"
    frequency_band: verification_required
    channel_bandwidth: verification_required
    number_of_subcarriers: "30 subcarrier groups"
    antenna_configuration: "One complex number per transmitter-receiver pair per subcarrier; exact AP/client antenna layout requires source README/diagram review"
    sampling_rate: "Inferred from timestamps"
    available_labels: [Gone, Approach, Enter, Mobile, Stationary, Exit, Departure]
    intended_aeris_use: "Public pretraining for empty/static/motion/entry/exit label hierarchy"
    loader_implementation_status: implemented
    notes: "Official README states CSI JSON files are one object per line, not one enclosing JSON array."

  - dataset_id: csi_traces
    official_name: "WISDOM CSI traces for various human activities"
    official_url: https://github.com/senselab-iitm/wisdom
    download_url: https://drive.google.com/drive/folders/13Crp-owAzkjZVH85AhisW9Yfi78wsoMf
    citation: "Lenka, Manoj and Chakraborty, Ayon. On-Device Deep Learning for IoT-based Wireless Sensing Applications. IEEE PerCom Workshops/WiSense 2024."
    license: verification_required
    source_format: "ESP32 text traces under data/human_activity_recognition; exact columns are documented in esp_col_desp.md inside the dataset download"
    csi_hardware_chipset: "ESP32 receiver streaming CSI to Raspberry Pi 3B"
    frequency_band: verification_required
    channel_bandwidth: verification_required
    number_of_subcarriers: verification_required
    antenna_configuration: verification_required
    sampling_rate: "Inferred from trace timestamps after column spec verification"
    available_labels: [empty, standing, sitting, sittingupdown, jumping, walking]
    intended_aeris_use: "Small-device public pretraining and cross-chip robustness experiments"
    loader_implementation_status: stub
    notes: "Adapter intentionally raises NotImplementedError until esp_col_desp.md or a small official sample is present locally."

  - dataset_id: csi_bench
    official_name: "CSI-Bench: A Large-Scale In-the-Wild Dataset for Multi-task WiFi Sensing"
    official_url: https://ai-iot-sensing.github.io/projects/project.html
    download_url: https://www.kaggle.com/datasets/guozhenjennzhu/csi-bench
    citation: "Zhu, Guozhen et al. CSI-Bench: A Large-Scale In-the-Wild Dataset for Multi-task WiFi Sensing. NeurIPS 2025 / arXiv:2505.21866."
    license: verification_required
    source_format: "Task directories with metadata, splits, H5/MAT CSI recordings in Kaggle release"
    csi_hardware_chipset: "Commercial WiFi routers and edge devices; 16 device types reported by project"
    frequency_band: verification_required
    channel_bandwidth: verification_required
    number_of_subcarriers: "feature_size=232 in official local config; raw representation requires per-task file verification"
    antenna_configuration: verification_required
    sampling_rate: verification_required
    available_labels: [fall_detection, breathing_monitoring, localization, motion_source, human_activity, human_identity, proximity]
    intended_aeris_use: "Large heterogeneous pretraining and robustness benchmarking; identity/breathing/localization remain auxiliary or self-supervised"
    loader_implementation_status: stub
    notes: "Large dataset is not downloaded automatically. H5/MAT loading needs optional h5py/scipy and local sample verification."

  - dataset_id: sensefi_ut_har
    official_name: SenseFi processed UT-HAR
    official_url: https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark
    download_url: https://drive.google.com/drive/folders/1R0R8SlVbLI1iUFQCzh_mH90H_4CW2iwt
    citation: "Yang, Jianfei et al. SenseFi: A Library and Benchmark on Deep-Learning-Empowered WiFi Human Sensing. Patterns 4(3), 2023."
    license: verification_required
    source_format: "Processed NumPy arrays stored under UT_HAR/data and UT_HAR/label"
    csi_hardware_chipset: "Intel 5300 NIC"
    frequency_band: verification_required
    channel_bandwidth: verification_required
    number_of_subcarriers: "CSI size 1 x 250 x 90 in SenseFi README"
    antenna_configuration: "1 processed link/channel"
    sampling_rate: verification_required
    available_labels: [lie_down, fall, walk, pickup, run, sit_down, stand_up]
    intended_aeris_use: "HAR auxiliary pretraining; fall/run/walk map to motion while static postures remain static"
    loader_implementation_status: partial
    notes: "UT-HAR processed arrays can be loaded with NumPy; full label semantics still need local file review."

  - dataset_id: sensefi_ntu_fi_har
    official_name: SenseFi processed NTU-Fi HAR
